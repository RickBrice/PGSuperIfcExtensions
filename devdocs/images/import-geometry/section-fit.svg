<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Choosing or fitting a girder library entry">
<title>Choosing or fitting a girder library entry</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="420" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">(a) Half outlines: the model's (grey) and a beam factory's fitted section (blue)</text>
<polygon points="290.0,60.0 208.4,60.0 208.4,70.2 249.2,77.0 279.8,87.2 279.8,270.8 247.5,287.8 247.5,311.6 290.0,311.6 290.0,311.6" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="290.0,60.0 211.8,60.0 211.8,72.2 252.6,78.7 278.1,90.6 278.1,267.4 244.1,289.5 244.1,311.6 290.0,311.6" fill="none" stroke="#1f6fb2" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="208.4" y1="60.0" x2="211.8" y2="60.0" stroke="#c0392b" stroke-width="1"/>
<circle cx="208.4" cy="60.0" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="211.8" cy="60.0" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="208.4" y1="70.2" x2="211.8" y2="72.2" stroke="#c0392b" stroke-width="1"/>
<circle cx="208.4" cy="70.2" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="211.8" cy="72.2" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="249.2" y1="77.0" x2="252.6" y2="78.7" stroke="#c0392b" stroke-width="1"/>
<circle cx="249.2" cy="77.0" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="252.6" cy="78.7" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="279.8" y1="87.2" x2="278.1" y2="90.6" stroke="#c0392b" stroke-width="1"/>
<circle cx="279.8" cy="87.2" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="278.1" cy="90.6" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="279.8" y1="270.8" x2="278.1" y2="267.4" stroke="#c0392b" stroke-width="1"/>
<circle cx="279.8" cy="270.8" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="278.1" cy="267.4" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="247.5" y1="287.8" x2="244.1" y2="289.5" stroke="#c0392b" stroke-width="1"/>
<circle cx="247.5" cy="287.8" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="244.1" cy="289.5" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="247.5" y1="311.6" x2="244.1" y2="311.6" stroke="#c0392b" stroke-width="1"/>
<circle cx="247.5" cy="311.6" r="2.4" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<circle cx="244.1" cy="311.6" r="2.4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<line x1="290.0" y1="50.0" x2="290.0" y2="321.6" stroke="#222" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<text x="296.0" y="315.6" class="small">axis of symmetry</text>
<text x="20.0" y="380.0" class="muted small">The left halves only. Corners (red pairs) are paired in order, then the distance between the outlines (points spaced</text>
<text x="20.0" y="395.0" class="muted small">along each outline to the nearest edge of the other) is minimized by least squares.</text>
<text x="400.0" y="58.0" class="title">(b) The entry for a girder</text>
<rect x="400.0" y="70.0" width="330.0" height="46.0" rx="5" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2"/>
<text x="412.0" y="89.0">Same section as a girder already done?</text>
<text x="412.0" y="107.0" class="small green">use its entry</text>
<line x1="565.0" y1="116.0" x2="565.0" y2="134.0" stroke="#1f6fb2" stroke-width="1.3" marker-end="url(#arrow-align)"/>
<text x="572.0" y="129.0" class="small muted">no</text>
<rect x="400.0" y="134.0" width="330.0" height="46.0" rx="5" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2"/>
<text x="412.0" y="153.0">A library entry's section matches?</text>
<text x="412.0" y="171.0" class="small green">use it (a named entry is preferred)</text>
<line x1="565.0" y1="180.0" x2="565.0" y2="198.0" stroke="#1f6fb2" stroke-width="1.3" marker-end="url(#arrow-align)"/>
<text x="572.0" y="193.0" class="small muted">no</text>
<rect x="400.0" y="198.0" width="330.0" height="46.0" rx="5" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2"/>
<text x="412.0" y="217.0">Fit every beam factory's dimensions</text>
<text x="412.0" y="235.0" class="small green">best accepted fit, constant depth</text>
<line x1="565.0" y1="244.0" x2="565.0" y2="262.0" stroke="#1f6fb2" stroke-width="1.3" marker-end="url(#arrow-align)"/>
<text x="572.0" y="257.0" class="small muted">no</text>
<rect x="400.0" y="262.0" width="330.0" height="46.0" rx="5" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2"/>
<text x="412.0" y="281.0">Make a new entry &quot;&lt;type&gt; (IFC)&quot;</text>
<text x="412.0" y="299.0" class="small green">fitted dimensions, a 2 in strand grid</text>
<text x="400.0" y="330.0" class="small">Matching tolerances: height, centroid, and the width at</text>
<text x="400.0" y="345.0" class="small">each depth 1/8 in; area and I 1%.</text>
</svg>
