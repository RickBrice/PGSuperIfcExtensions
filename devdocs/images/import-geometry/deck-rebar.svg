<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Deck reinforcement as lump sums">
<title>Deck reinforcement as lump sums</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="350" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">(a) Deck section: primary lines in two mats</text>
<rect x="40.0" y="70.0" width="300.0" height="70.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<circle cx="60.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="60.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="90.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="90.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="120.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="120.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="150.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="150.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="180.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="180.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="210.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="210.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="240.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="240.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="270.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="270.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="300.0" cy="88.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="300.0" cy="124.0" r="3.6" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<line x1="356.0" y1="70.0" x2="356.0" y2="88.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="362.0" y="84.0" class="meas small">top cover</text>
<line x1="356.0" y1="124.0" x2="356.0" y2="140.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="362.0" y="136.0" class="meas small">bottom cover</text>
<line x1="60.0" y1="160.0" x2="360.0" y2="160.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="210.0" y="180.0" class="meas small" text-anchor="middle">width covered: first line to last, plus one spacing</text>
<text x="20.0" y="210.0" class="small">lump sum = area of one bar of each primary line / width covered</text>
<text x="20.0" y="226.0" class="small">cover: the depth of the primary bars' centroid (top mat), or its</text>
<text x="20.0" y="242.0" class="small">height above the bottom (bottom mat)</text>
<text x="20.0" y="258.0" class="small">mats: the primary lines' depths split at their largest gap (over 1 in)</text>
<text x="500.0" y="28.0" class="title">(b) Plan: supplemental bars at a pier</text>
<line x1="500.0" y1="70.0" x2="740.0" y2="70.0" stroke="#6b6b6b" stroke-width="1"/>
<line x1="500.0" y1="170.0" x2="740.0" y2="170.0" stroke="#6b6b6b" stroke-width="1"/>
<line x1="620.0" y1="55.0" x2="620.0" y2="185.0" stroke="#222" stroke-width="1.2" stroke-dasharray="8 3 2 3"/>
<text x="620.0" y="200.0" class="small" text-anchor="middle">CL pier</text>
<line x1="500.0" y1="85.0" x2="740.0" y2="85.0" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="500.0" y1="100.0" x2="740.0" y2="100.0" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="500.0" y1="115.0" x2="740.0" y2="115.0" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="500.0" y1="130.0" x2="740.0" y2="130.0" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="500.0" y1="145.0" x2="740.0" y2="145.0" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="500.0" y1="160.0" x2="740.0" y2="160.0" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="560.0" y1="92.0" x2="690.0" y2="92.0" stroke="#d4801f" stroke-width="2.2"/>
<line x1="560.0" y1="122.0" x2="690.0" y2="122.0" stroke="#d4801f" stroke-width="2.2"/>
<line x1="560.0" y1="152.0" x2="690.0" y2="152.0" stroke="#d4801f" stroke-width="2.2"/>
<line x1="560.0" y1="214.0" x2="620.0" y2="214.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="620.0" y1="214.0" x2="690.0" y2="214.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="625.0" y="232.0" class="meas small" text-anchor="middle">cutoffs: median distances to the bar ends</text>
<text x="500.0" y="256.0" class="small">primary lines cover at least 75% of the bridge</text>
<text x="500.0" y="271.0" class="small">length; the others are supplemental, at the</text>
<text x="500.0" y="286.0" class="small">pier they cross nearest their middle</text>
<text x="20.0" y="318.0" class="muted small">Deck bars: centerlines 90% inside the deck slab, more along the alignment than across it. Bars within 2 in of offset</text>
<text x="20.0" y="333.0" class="muted small">and 1 in of depth are a line (e.g. bars lapped end to end).</text>
</svg>
