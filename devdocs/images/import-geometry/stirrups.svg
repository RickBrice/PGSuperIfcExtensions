<line x1="380.0" y1="50.0" x2="380.0" y2="210.0" stroke="#222" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<text x="380.0" y="46.0" class="small" text-anchor="middle">midspan: the zones are symmetric</text>
<text x="500.0" y="40.0" class="small steel">legs reaching more than 1 in above the</text>
<text x="500.0" y="54.0" class="small steel">girder top engage the deck</text>
<text x="20.0" y="305.0" class="muted small">A leg is a straight piece within 15 degrees of vertical, at least half the girder depth. Bars within 1 in along the</text>
<text x="20.0" y="320.0" class="muted small">girder are one station. Equal spaces (1/4 in) with the same bars make a zone; spacings round to 1/8 in (1 mm in SI).</text>
