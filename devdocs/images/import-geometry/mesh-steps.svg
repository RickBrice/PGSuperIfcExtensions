<line x1="109.0" y1="78.8" x2="127.0" y2="106.8" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="109.0" y1="78.8" x2="99.0" y2="111.2" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="137.0" y1="74.4" x2="155.0" y2="102.4" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="137.0" y1="74.4" x2="127.0" y2="106.8" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="165.0" y1="70.0" x2="183.0" y2="98.0" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="71.0" y1="115.6" x2="43.0" y2="149.6" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="99.0" y1="111.2" x2="71.0" y2="145.2" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="127.0" y1="106.8" x2="99.0" y2="140.8" stroke="#4a5a70" stroke-width="0.7"/>
<line x1="155.0" y1="102.4" x2="127.0" y2="136.4" stroke="#4a5a70" stroke-width="0.7"/>
<polygon points="210.0,92.0 228.0,120.0 228.0,154.0 210.0,126.0" fill="#eeeeee" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="228.0,120.0 368.0,98.0 368.0,132.0 228.0,154.0" fill="#eeeeee" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="210.0,92.0 350.0,70.0 368.0,98.0 228.0,120.0" fill="#9fc3e6" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<text x="285.0" y="180.0" class="small muted" text-anchor="middle">top: highest when each</text>
<text x="285.0" y="195.0" class="small muted" text-anchor="middle">component is pushed out</text>
<text x="285.0" y="210.0" class="small muted" text-anchor="middle">along its average normal</text>
<polygon points="395.0,92.0 535.0,70.0 553.0,98.0 413.0,120.0" fill="#eef4fb" stroke="#1f6fb2" stroke-width="2" stroke-linejoin="round"/>
<circle cx="395.0" cy="92.0" r="2.5" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<circle cx="535.0" cy="70.0" r="2.5" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<circle cx="553.0" cy="98.0" r="2.5" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<circle cx="413.0" cy="120.0" r="2.5" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<text x="470.0" y="180.0" class="small muted" text-anchor="middle">the outline of the top face,</text>
<text x="470.0" y="195.0" class="small muted" text-anchor="middle">a chain of edges</text>
<line x1="580.0" y1="92.0" x2="720.0" y2="70.0" stroke="#2e8b57" stroke-width="3"/>
<line x1="738.0" y1="98.0" x2="598.0" y2="120.0" stroke="#2e8b57" stroke-width="3"/>
<line x1="720.0" y1="70.0" x2="738.0" y2="98.0" stroke="#c0392b" stroke-width="3"/>
<line x1="598.0" y1="120.0" x2="580.0" y2="92.0" stroke="#c0392b" stroke-width="3"/>
<circle cx="729.0" cy="84.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="589.0" cy="106.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="655.0" y="180.0" class="small meas" text-anchor="middle">shortest two: the ends</text>
<text x="655.0" y="195.0" class="small meas" text-anchor="middle">(their midpoints are on the CL)</text>
<text x="655.0" y="212.0" class="small green" text-anchor="middle">longest two: the edges</text>
<text x="20.0" y="250.0" class="muted small">The same steps find a girder's ends (segments split where the direction turns more than 1 degree) and the</text>
<text x="20.0" y="265.0" class="muted small">deck's edges (10 degrees). Faces belong to one smooth component while adjacent faces turn less than 10 degrees.</text>
</svg>
