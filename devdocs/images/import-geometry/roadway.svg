<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Roadway section from the top of the deck">
<title>Roadway section from the top of the deck</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="320" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">Top of the deck at a cut: its corners are the ridge points, with one at the alignment</text>
<polygon points="40.0,180.0 70.0,168.0 380.0,128.0 690.0,168.0 720.0,180.0 720.0,210.0 40.0,210.0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="70.0,168.0 380.0,128.0 690.0,168.0" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="40.0" y1="180.0" x2="70.0" y2="168.0" stroke="#666" stroke-width="2.4" stroke-dasharray="3 2"/>
<line x1="690.0" y1="168.0" x2="720.0" y2="180.0" stroke="#666" stroke-width="2.4" stroke-dasharray="3 2"/>
<circle cx="70.0" cy="168.0" r="4" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="380.0" cy="128.0" r="4" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="690.0" cy="168.0" r="4" fill="#c0392b" stroke="none" stroke-width="1"/>
<line x1="380.0" y1="60.0" x2="380.0" y2="240.0" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="10 4 2 4"/>
<text x="386.0" y="72.0" class="align small">alignment: ridge point (a corner within 1/2 in moves here)</text>
<text x="210.0" y="138.0" class="meas small" text-anchor="middle">slope</text>
<text x="550.0" y="138.0" class="meas small" text-anchor="middle">slope</text>
<text x="560.0" y="230.0" class="muted small">edges steeper than 25%:</text>
<text x="560.0" y="244.0" class="muted small">a chamfer or drip, left out</text>
<text x="20.0" y="270.0" class="muted small">Cuts at the quarter points of each span and as near the bridge ends as the deck is full width. One template if the</text>
<text x="20.0" y="285.0" class="muted small">sections agree within 1/8 in; otherwise templates where the section changes (1/16 in), extended to the end piers.</text>
</svg>
