<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Girder spacing at a pier line">
<title>Girder spacing at a pier line</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="340" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">Plan at a pier: where each girder CL crosses the measurement line</text>
<line x1="380.0" y1="50.0" x2="380.0" y2="250.0" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="10 4 2 4"/>
<line x1="394.0" y1="210.0" x2="394.0" y2="240.0" stroke="#1f6fb2" stroke-width="1.4" marker-end="url(#arrow-align)"/>
<text x="400.0" y="232.0" class="align small">ahead</text>
<text x="386.0" y="58.0" class="align small">alignment</text>
<circle cx="380.0" cy="150.0" r="4" fill="#1f6fb2" stroke="none" stroke-width="1"/>
<text x="388.0" y="168.0" class="align small">pier station</text>
<line x1="60.0" y1="150.0" x2="700.0" y2="150.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="64.0" y="142.0" class="meas small">normal to the alignment</text>
<line x1="61.2" y1="64.6" x2="698.8" y2="235.4" stroke="#2e8b57" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="698.8" y="251.4" class="green small" text-anchor="end">along the CL pier</text>
<line x1="135.0" y1="50.0" x2="145.0" y2="250.0" stroke="#4a5a70" stroke-width="1.2" stroke-dasharray="6 3"/>
<circle cx="140.0" cy="150.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="136.7" cy="84.8" r="3.5" fill="#2e8b57" stroke="none" stroke-width="1"/>
<line x1="295.0" y1="50.0" x2="305.0" y2="250.0" stroke="#4a5a70" stroke-width="1.2" stroke-dasharray="6 3"/>
<circle cx="300.0" cy="150.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="298.9" cy="128.3" r="3.5" fill="#2e8b57" stroke="none" stroke-width="1"/>
<line x1="455.0" y1="50.0" x2="465.0" y2="250.0" stroke="#4a5a70" stroke-width="1.2" stroke-dasharray="6 3"/>
<circle cx="460.0" cy="150.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="461.1" cy="171.7" r="3.5" fill="#2e8b57" stroke="none" stroke-width="1"/>
<line x1="615.0" y1="50.0" x2="625.0" y2="250.0" stroke="#4a5a70" stroke-width="1.2" stroke-dasharray="6 3"/>
<circle cx="620.0" cy="150.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="623.3" cy="215.2" r="3.5" fill="#2e8b57" stroke="none" stroke-width="1"/>
<line x1="140.0" y1="122.0" x2="300.0" y2="122.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="220.0" y="116.0" class="meas">s1</text>
<line x1="300.0" y1="122.0" x2="460.0" y2="122.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="398.0" y="116.0" class="meas">s2</text>
<line x1="460.0" y1="122.0" x2="620.0" y2="122.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="540.0" y="116.0" class="meas">s3</text>
<text x="20.0" y="295.0" class="muted small">Spacing is the difference of the crossing offsets. It's uniform when every spacing at every pier line agrees within</text>
<text x="20.0" y="310.0" class="muted small">1/16 in, tried normal to the alignment first, then along the CL piers; otherwise it's set at each pier face.</text>
</svg>
