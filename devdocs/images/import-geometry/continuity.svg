<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Boundary condition from a pier diaphragm">
<title>Boundary condition from a pier diaphragm</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="250" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">Elevation at a pier: continuous when a diaphragm engages the girder ends of both spans</text>
<rect x="40.0" y="60.0" width="320.0" height="16.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<rect x="40.0" y="80.0" width="140.0" height="50.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<rect x="220.0" y="80.0" width="140.0" height="50.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<rect x="160.0" y="140.0" width="80.0" height="50.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<line x1="200.0" y1="50.0" x2="200.0" y2="205.0" stroke="#222" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<rect x="165.0" y="130.0" width="16.0" height="10.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<rect x="219.0" y="130.0" width="16.0" height="10.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<rect x="168.0" y="76.0" width="64.0" height="64.0" rx="0" fill="#b9dcc6" stroke="#2e8b57" stroke-width="1.6"/>
<text x="200.0" y="225.0" class="green small" text-anchor="middle">diaphragm spans both ends (within 1 in):</text>
<text x="200.0" y="240.0" class="green small" text-anchor="middle">continuous after deck</text>
<rect x="420.0" y="60.0" width="320.0" height="16.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<rect x="420.0" y="80.0" width="140.0" height="50.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<rect x="600.0" y="80.0" width="140.0" height="50.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<rect x="540.0" y="140.0" width="80.0" height="50.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<line x1="580.0" y1="50.0" x2="580.0" y2="205.0" stroke="#222" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<rect x="545.0" y="130.0" width="16.0" height="10.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<rect x="599.0" y="130.0" width="16.0" height="10.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<text x="580.0" y="225.0" class="small" text-anchor="middle">no such diaphragm: the bearings' support</text>
<text x="580.0" y="240.0" class="small" text-anchor="middle">condition (Fixed: hinge, Expansion: roller)</text>
</svg>
