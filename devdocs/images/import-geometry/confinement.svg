<line x1="110.0" y1="209.8" x2="350.0" y2="209.8" stroke="#222" stroke-width="1" stroke-dasharray="6 3"/>
<text x="354.0" y="213.8" class="small">40% of the depth</text>
<circle cx="194.0" cy="302.0" r="3.0" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="201.2" cy="302.0" r="3.0" fill="#8a5a2b" stroke="none" stroke-width="1"/>
