<polygon points="190.4,282.2 190.4,311.0 269.6,311.0 269.6,282.2" fill="none" stroke="#2e8b57" stroke-width="2.2" stroke-linejoin="round"/>
<text x="370.0" y="306.0" class="green small">encloses the bottom row: confinement</text>
<line x1="269.6" y1="302.0" x2="366.0" y2="302.0" stroke="#2e8b57" stroke-width="0.8"/>
<line x1="222.1" y1="194.0" x2="237.9" y2="194.0" stroke="#666" stroke-width="2.2"/>
<text x="190.0" y="190.0" class="muted small" text-anchor="end">above the 40% line:</text>
<text x="190.0" y="204.0" class="muted small" text-anchor="end">not confinement</text>
<line x1="219.2" y1="194.0" x2="194.0" y2="194.0" stroke="#666" stroke-width="0.8"/>
<line x1="225.7" y1="57.2" x2="225.7" y2="305.6" stroke="#8a5a2b" stroke-width="1.4"/>
<line x1="234.3" y1="57.2" x2="234.3" y2="305.6" stroke="#8a5a2b" stroke-width="1.4"/>
<text x="440.0" y="80.0" class="small">The bar's path in the section, its ends joined,</text>
<text x="440.0" y="96.0" class="small">must enclose the strands within 1 in of the</text>
<text x="440.0" y="112.0" class="small">lowest (with no strands: the CL girder 1 in</text>
<text x="440.0" y="128.0" class="small">above the bar's lowest point).</text>
<text x="440.0" y="144.0" class="small"></text>
<text x="440.0" y="160.0" class="small">It's at the stirrup station nearest it (within</text>
<text x="440.0" y="176.0" class="small">3 in and half the spacing), whose zone gets its</text>
<text x="440.0" y="192.0" class="small">size as the confinement bar size.</text>
