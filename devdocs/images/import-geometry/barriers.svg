<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Traffic barrier section">
<title>Traffic barrier section</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="330" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">(a) Cut at mid-bridge, normal to the alignment</text>
<polygon points="40.0,200.0 338.9,173.9 340.6,193.8 41.7,219.9" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="40.0,200.0 79.8,196.5 72.1,177.1 55.1,166.6 48.1,108.9 32.2,110.3" fill="#d8cfc4" stroke="#7c6a55" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="40.0" cy="200.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="36.0" y="234.0" class="meas small">deck edge at the top of the deck</text>
<text x="170.0" y="120.0" class="small" text-anchor="middle">the outermost barrier on each side</text>
<text x="170.0" y="135.0" class="small" text-anchor="middle">is the exterior barrier</text>
<text x="400.0" y="28.0" class="title">(b) In traffic barrier coordinates</text>
<polygon points="470.0,230.0 530.0,230.0 521.0,200.0 497.0,182.0 494.0,95.0 470.0,95.0" fill="#d8cfc4" stroke="#7c6a55" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="470.0,230.0 531.5,230.0 522.5,201.5 497.0,181.2 494.0,95.0 470.0,95.0" fill="none" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="5 3" stroke-linejoin="round"/>
<line x1="470.0" y1="230.0" x2="570.0" y2="230.0" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="574.0" y="234.0" class="green small">toward the roadway</text>
<line x1="470.0" y1="230.0" x2="470.0" y2="80.0" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<circle cx="470.0" cy="230.0" r="3.5" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="476.0" y="248.0" class="meas small">origin: the deck edge</text>
<text x="560.0" y="110.0" class="small">turned back by the cross slope</text>
<text x="560.0" y="125.0" class="small">at the edge (PGSuper turns it to</text>
<text x="560.0" y="140.0" class="small">the slope again); the right barrier</text>
<text x="560.0" y="155.0" class="small">is mirrored</text>
<text x="560.0" y="190.0" class="align small">dashed: a library entry</text>
<text x="20.0" y="285.0" class="muted small">A library entry whose outline is within 1/8 in (Hausdorff distance) is used, the one named in the model if it's that close;</text>
<text x="20.0" y="300.0" class="muted small">otherwise a new entry &quot;&lt;name&gt; (IFC)&quot; is made from the section, its weight computed.</text>
</svg>
