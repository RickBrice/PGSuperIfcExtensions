<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Slab offset at the CL bearing">
<title>Slab offset at the CL bearing</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="300" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">Elevation at a girder end: the slab offset (&quot;A&quot; dimension) is top of deck to top of girder at the CL bearing</text>
<rect x="30.0" y="70.0" width="330.0" height="22.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<rect x="60.0" y="100.0" width="300.0" height="60.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<rect x="60.0" y="92.0" width="300.0" height="8.0" rx="0" fill="#ececec" stroke="#6b6b6b" stroke-width="1.2"/>
<rect x="78.0" y="160.0" width="24.0" height="10.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="90.0" y1="50.0" x2="90.0" y2="190.0" stroke="#222" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<text x="90.0" y="205.0" class="small" text-anchor="middle">CL bearing</text>
<line x1="104.0" y1="70.0" x2="104.0" y2="100.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="110.0" y="88.0" class="meas small">slab offset</text>
<text x="195.0" y="240.0" class="small" text-anchor="middle">measured at the CL bearing</text>
<rect x="490.0" y="70.0" width="240.0" height="22.0" rx="0" fill="#e4e4e4" stroke="#6b6b6b" stroke-width="1.2"/>
<rect x="430.0" y="100.0" width="300.0" height="60.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<rect x="430.0" y="92.0" width="300.0" height="8.0" rx="0" fill="#ececec" stroke="#6b6b6b" stroke-width="1.2"/>
<rect x="448.0" y="160.0" width="24.0" height="10.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="460.0" y1="50.0" x2="460.0" y2="190.0" stroke="#222" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<text x="460.0" y="205.0" class="small" text-anchor="middle">CL bearing</text>
<line x1="500.0" y1="70.0" x2="500.0" y2="100.0" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="500.0" cy="70.0" r="2" fill="#c0392b" stroke="none" stroke-width="1"/>
<line x1="530.0" y1="70.0" x2="530.0" y2="100.0" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="530.0" cy="70.0" r="2" fill="#c0392b" stroke="none" stroke-width="1"/>
<line x1="560.0" y1="70.0" x2="560.0" y2="100.0" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="560.0" cy="70.0" r="2" fill="#c0392b" stroke="none" stroke-width="1"/>
<line x1="590.0" y1="70.0" x2="590.0" y2="100.0" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="590.0" cy="70.0" r="2" fill="#c0392b" stroke="none" stroke-width="1"/>
<line x1="460.0" y1="71.0" x2="590.0" y2="70.0" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="460.0" cy="71.0" r="3" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="565.0" y="240.0" class="small" text-anchor="middle">no slab over the bearing (e.g. an integral end):</text>
<text x="565.0" y="255.0" class="small" text-anchor="middle">a line through four samples 1 ft apart, extrapolated</text>
<text x="20.0" y="282.0" class="muted small">One slab offset for the bridge if all agree within 1/16 in, else one per bearing line, else one per girder end.</text>
</svg>
