<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Girder section cut and measures">
<title>Girder section cut and measures</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="380" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">(a) Cut at mid-length, normal to the girder axis</text>
<rect x="30.0" y="70.0" width="300.0" height="60.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<line x1="180.0" y1="50.0" x2="180.0" y2="150.0" stroke="#c0392b" stroke-width="2"/>
<text x="186.0" y="162.0" class="meas small">cut at 0.5 of the length</text>
<text x="30.0" y="178.0" class="muted small">(away from end blocks and tapers)</text>
<text x="20.0" y="215.0" class="title">(b) Turned upright</text>
<polygon points="100.0,240.0 77.3,242.4 77.6,245.2 89.2,245.9 98.0,247.9 103.3,298.9 94.8,304.5 95.5,311.2 107.3,309.9 119.2,308.7 118.5,302.1 109.0,298.3 103.6,247.3 111.8,243.5 123.0,240.5 122.7,237.6" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<text x="100.0" y="342.0" class="small" text-anchor="middle">rotated with the deck</text>
<line x1="170.0" y1="280.0" x2="200.0" y2="280.0" stroke="#222" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<polygon points="260.0,240.0 237.2,240.0 237.2,242.8 248.6,244.8 257.1,247.6 257.1,298.9 248.1,303.6 248.1,310.3 260.0,310.3 271.9,310.3 271.9,303.6 262.9,298.9 262.9,247.6 271.4,244.8 282.8,242.8 282.8,240.0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<text x="260.0" y="342.0" class="small" text-anchor="middle">least height: upright</text>
<text x="20.0" y="365.0" class="muted small">Turned within 15 degrees, in 0.05 degree steps; the largest loop is the outside, loops inside it are voids.</text>
<text x="400.0" y="28.0" class="title">(c) What's measured</text>
<polygon points="520.0,60.0 445.6,60.0 445.6,69.3 482.8,75.5 510.7,84.8 510.7,252.2 481.2,267.7 481.2,289.4 520.0,289.4 558.8,289.4 558.8,267.7 529.3,252.2 529.3,84.8 557.2,75.5 594.4,69.3 594.4,60.0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="445.6" y1="60.0" x2="594.4" y2="60.0" stroke="#c0392b" stroke-width="0.9"/>
<line x1="492.1" y1="78.6" x2="547.9" y2="78.6" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="97.2" x2="529.3" y2="97.2" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="115.8" x2="529.3" y2="115.8" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="134.4" x2="529.3" y2="134.4" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="153.0" x2="529.3" y2="153.0" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="171.6" x2="529.3" y2="171.6" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="190.2" x2="529.3" y2="190.2" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="208.8" x2="529.3" y2="208.8" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="227.4" x2="529.3" y2="227.4" stroke="#c0392b" stroke-width="0.9"/>
<line x1="510.7" y1="246.0" x2="529.3" y2="246.0" stroke="#c0392b" stroke-width="0.9"/>
<line x1="487.1" y1="264.6" x2="552.9" y2="264.6" stroke="#c0392b" stroke-width="0.9"/>
<line x1="481.2" y1="283.2" x2="558.8" y2="283.2" stroke="#c0392b" stroke-width="0.9"/>
<line x1="615.0" y1="60.0" x2="615.0" y2="289.4" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="621.0" y="174.7" class="meas" text-anchor="start">height</text>
<circle cx="520.0" cy="153.0" r="4" fill="#2e8b57" stroke="none" stroke-width="1"/>
<text x="530.0" y="157.0" class="green small">centroid, I</text>
<text x="400.0" y="315.0" class="small">height, area, centroid, I about the centroid, width;</text>
<text x="400.0" y="330.0" class="small">the width at every 1/8 in of depth (red lines, drawn coarser)</text>
<text x="400.0" y="345.0" class="small">and the area above every 1/2 in of depth</text>
</svg>
