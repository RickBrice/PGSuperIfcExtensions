<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Coordinate systems used by the import">
<title>Coordinate systems used by the import</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="360" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">(a) Plan: station and offset, girder axis</text>
<polyline points="40.0,120.0 49.5,117.6 59.1,115.2 68.6,113.1 78.2,111.0 87.8,109.1 97.5,107.2 107.1,105.6 116.8,104.0 126.5,102.6 136.2,101.2 146.0,100.1 155.8,99.0 165.6,98.1 175.4,97.2 185.3,96.6 195.2,96.0 205.1,95.6 215.1,95.3 225.0,95.1 235.0,95.0 245.0,95.1 255.1,95.2 265.1,95.6 275.2,96.0 285.3,96.6 295.4,97.2 305.6,98.1 315.8,99.0 326.0,100.1 336.2,101.2 346.5,102.6 356.8,104.0 367.1,105.6 377.4,107.2 387.8,109.1 398.2,111.0 408.6,113.1 419.1,115.2 429.5,117.6 440.0,120.0" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="10 4 2 4" stroke-linejoin="round"/>
<text x="40.0" y="108.0" class="align small">alignment</text>
<line x1="79.4" y1="116.9" x2="77.0" y2="105.1" stroke="#1f6fb2" stroke-width="1.2"/>
<line x1="175.9" y1="103.2" x2="175.0" y2="91.3" stroke="#1f6fb2" stroke-width="1.2"/>
<line x1="274.9" y1="102.0" x2="275.5" y2="90.0" stroke="#1f6fb2" stroke-width="1.2"/>
<line x1="376.4" y1="113.2" x2="378.5" y2="101.3" stroke="#1f6fb2" stroke-width="1.2"/>
<text x="273.2" y="82.0" class="align small" text-anchor="middle">station</text>
<line x1="289.2" y1="96.7" x2="325.1" y2="98.5" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#arrow-align)"/>
<text x="331.1" y="94.7" class="align small">ahead</text>
<line x1="275.2" y1="96.0" x2="271.5" y2="170.9" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="279.5" y="137.5" class="meas small">offset, + right</text>
<circle cx="271.5" cy="170.9" r="3.2" fill="#c0392b" stroke="none" stroke-width="1"/>
<polygon points="70.5,198.0 410.5,223.0 409.5,237.0 69.5,212.0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="70.0" y1="205.0" x2="410.0" y2="230.0" stroke="#4a5a70" stroke-width="1" stroke-dasharray="8 3 2 3"/>
<circle cx="70.0" cy="205.0" r="3" fill="#222" stroke="none" stroke-width="1"/>
<circle cx="410.0" cy="230.0" r="3" fill="#222" stroke="none" stroke-width="1"/>
<text x="66.0" y="193.0" class="small" text-anchor="start">start (lesser station)</text>
<text x="410.0" y="256.0" class="small" text-anchor="end">end</text>
<line x1="109.9" y1="237.9" x2="169.7" y2="242.3" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="173.7" y="246.6" class="green small">x (along the girder)</text>
<line x1="109.9" y1="237.9" x2="107.0" y2="277.8" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="101.0" y="293.8" class="green small" text-anchor="middle">z (+ right)</text>
<text x="20.0" y="315.0" class="muted small">Global plan coordinates are the model's, in PGSuper's units. A point's station and</text>
<text x="20.0" y="330.0" class="muted small">offset are from the alignment, offsets positive to the right looking ahead on station.</text>
<text x="470.0" y="28.0" class="title">(b) Girder elevation</text>
<rect x="490.0" y="70.0" width="230.0" height="52.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<line x1="490.0" y1="70.0" x2="735.0" y2="70.0" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="726.0" y="64.0" class="green small">x</text>
<line x1="490.0" y1="70.0" x2="490.0" y2="140.0" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="496.0" y="146.0" class="green small">y (depth below the top)</text>
<text x="484.0" y="64.0" class="small" text-anchor="start">top of girder at its start</text>
<text x="470.0" y="170.0" class="title">(c) Section</text>
<polygon points="600.0,200.0 567.6,200.0 567.6,204.1 583.8,206.8 596.0,210.8 596.0,283.7 583.1,290.4 583.1,299.9 600.0,299.9 616.9,299.9 616.9,290.4 604.0,283.7 604.0,210.8 616.2,206.8 632.4,204.1 632.4,200.0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="600.0" y1="200.0" x2="670.0" y2="200.0" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="674.0" y="204.0" class="green small">x</text>
<line x1="600.0" y1="200.0" x2="600.0" y2="175.0" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="606.0" y="184.0" class="green small">y (up)</text>
<circle cx="600.0" cy="200.0" r="3" fill="#2e8b57" stroke="none" stroke-width="1"/>
<text x="470.0" y="315.0" class="muted small">Sections are cut normal to the girder axis, origin at the</text>
<text x="470.0" y="330.0" class="muted small">top center, x horizontal, y up.</text>
</svg>
