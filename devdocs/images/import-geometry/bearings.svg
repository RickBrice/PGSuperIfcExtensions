<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Bearings, end distance, and bearing offset">
<title>Bearings, end distance, and bearing offset</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="360" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">(a) Plan at a pier face</text>
<line x1="90.0" y1="60.0" x2="90.0" y2="250.0" stroke="#222" stroke-width="1.4" stroke-dasharray="10 4 2 4"/>
<text x="90.0" y="268.0" class="small" text-anchor="middle">CL pier</text>
<rect x="150.0" y="124.0" width="300.0" height="52.0" rx="0" fill="#cfd8e3" stroke="#4a5a70" stroke-width="1.2"/>
<line x1="150.0" y1="150.0" x2="460.0" y2="150.0" stroke="#4a5a70" stroke-width="0.8" stroke-dasharray="6 3"/>
<text x="462.0" y="154.0" class="small">CL girder</text>
<rect x="176.0" y="128.0" width="28.0" height="14.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<circle cx="190.0" cy="135.0" r="2.4" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<rect x="176.0" y="158.0" width="28.0" height="14.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<circle cx="190.0" cy="165.0" r="2.4" fill="#8a5a2b" stroke="none" stroke-width="1"/>
<circle cx="190.0" cy="150.0" r="4" fill="#c0392b" stroke="none" stroke-width="1"/>
<circle cx="150.0" cy="150.0" r="3" fill="#222" stroke="none" stroke-width="1"/>
<line x1="90.0" y1="90.0" x2="90.0" y2="124.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="190.0" y1="90.0" x2="190.0" y2="128.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="90.0" y1="98.0" x2="190.0" y2="98.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="140.0" y="90.0" class="meas small" text-anchor="middle">bearing offset</text>
<line x1="150.0" y1="176.0" x2="150.0" y2="210.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="190.0" y1="172.0" x2="190.0" y2="210.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="150.0" y1="202.0" x2="190.0" y2="202.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="198.0" y="206.0" class="meas small">end distance</text>
<text x="250.0" y="98.0" class="meas small">CL bearing (red): on the CL girder, at the bearings'</text>
<text x="250.0" y="112.0" class="meas small">average distance from the girder end</text>
<text x="20.0" y="296.0" class="muted small">Both are measured normal to the CL pier; each pier face gets the median</text>
<text x="20.0" y="311.0" class="muted small">of its girders (a spread over 1/4 in is logged). A bearing belongs to the</text>
<text x="20.0" y="326.0" class="muted small">nearest girder end it's under: up to 6 ft in from the end, within 3 ft of the CL.</text>
<text x="540.0" y="28.0" class="title">(b) Bearing size</text>
<text x="540.0" y="60.0" class="small">rectangular: length along the girder,</text>
<text x="540.0" y="75.0" class="small">width across; height from the z range</text>
<rect x="570.0" y="92.0" width="90.0" height="44.0" rx="0" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="570.0" y1="150.0" x2="660.0" y2="150.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="615.0" y="166.0" class="meas small" text-anchor="middle">length</text>
<line x1="674.0" y1="92.0" x2="674.0" y2="136.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="682.0" y="118.0" class="meas small">width</text>
<text x="540.0" y="198.0" class="small">round: 8 or more distinct plan points</text>
<text x="540.0" y="213.0" class="small">within 2% of a common radius</text>
<circle cx="615" cy="256" r="28" fill="#f2d9c4" stroke="#8a5a2b" stroke-width="1.2"/>
<line x1="587.0" y1="256.0" x2="643.0" y2="256.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="615.0" y="300.0" class="meas small" text-anchor="middle">diameter</text>
</svg>
