<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Deck edges and deck points">
<title>Deck edges and deck points</title>

<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #222; }
  .muted { fill: #666; }
  .small { font-size: 11.5px; }
  .title { font-weight: 600; font-size: 14px; }
  .meas { fill: #c0392b; }
  .align { fill: #1f6fb2; }
  .green { fill: #2e8b57; }
  .steel { fill: #8a5a2b; }
  .orange { fill: #d4801f; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <marker id="arrow-align" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="330" rx="8" fill="#ffffff" stroke="#d0d0d0"/>
<text x="20.0" y="28.0" class="title">Plan: the deck's long edges become deck points (station, left and right offsets)</text>
<polygon points="60.0,90.0 300.0,90.0 480.0,70.0 700.0,70.0 700.0,230.0 60.0,230.0" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="30.0" y1="160.0" x2="730.0" y2="160.0" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="10 4 2 4"/>
<text x="70.0" y="152.0" class="align small">alignment</text>
<text x="684.0" y="218.0" class="small" text-anchor="end">the deck's two longest edges (green); its ends (red)</text>
<polyline points="60.0,90.0 300.0,90.0 480.0,70.0 700.0,70.0" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round"/>
<polyline points="60.0,230.0 700.0,230.0" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round"/>
<line x1="60.0" y1="90.0" x2="60.0" y2="230.0" stroke="#c0392b" stroke-width="3"/>
<line x1="700.0" y1="70.0" x2="700.0" y2="230.0" stroke="#c0392b" stroke-width="3"/>
<line x1="60.0" y1="50.0" x2="60.0" y2="255.0" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="60.0" cy="160.0" r="3" fill="#222" stroke="none" stroke-width="1"/>
<line x1="300.0" y1="50.0" x2="300.0" y2="255.0" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="300.0" cy="160.0" r="3" fill="#222" stroke="none" stroke-width="1"/>
<line x1="480.0" y1="50.0" x2="480.0" y2="255.0" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="480.0" cy="160.0" r="3" fill="#222" stroke="none" stroke-width="1"/>
<text x="60.0" y="272.0" class="small" text-anchor="middle">deck point</text>
<text x="300.0" y="272.0" class="small" text-anchor="middle">deck point</text>
<text x="480.0" y="272.0" class="small" text-anchor="middle">deck point</text>
<text x="180.0" y="84.0" class="small green" text-anchor="middle">parallel</text>
<text x="390.0" y="70.0" class="small green" text-anchor="middle">linear</text>
<text x="590.0" y="64.0" class="small green" text-anchor="middle">parallel</text>
<text x="20.0" y="295.0" class="muted small">Edges are simplified to within 1/8 in of offset (Douglas-Peucker); a stretch of constant offset parallels the alignment.</text>
<text x="20.0" y="310.0" class="muted small">A top surface stopping short of the deck's outermost points (a chamfer or drip, 1/16 to 6 in) moves the edge out.</text>
</svg>
